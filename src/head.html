<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hloptech Puns</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* An Instagram-style app: stories tray + 4:5 joke posts on Home, a searchable Archive, and Liked. Floating 3-item nav. */
:root{
  --bg:#ffffff; --elev:#ffffff; --surface:#efefef; --surface-2:#dbdbdb; --ink:#0c1014; --ink-2:#737373;
  --line:#dbdbdb; --like:#ff3040; --link:#0095f6; --scrim:rgba(0,0,0,.55);
  --s:#e5484d; --a:#2f62e6; --d:#e0a100;
  --ring:linear-gradient(45deg,#feda75,#fa7e1e 30%,#d62976 60%,#962fbf 80%,#4f5bd5);
  --display:"Suez One","Rubik",Georgia,serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --col:470px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --elev:#16181c; --surface:#1f2328; --surface-2:#2f343a; --ink:#f5f5f5; --ink-2:#a8a8a8;
  --line:#262626; --scrim:rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --elev:#16181c; --surface:#1f2328; --surface-2:#2f343a; --ink:#f5f5f5; --ink-2:#a8a8a8;
  --line:#262626; --scrim:rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg);overflow-x:clip}
body{color:var(--ink);font:400 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.col{max-width:var(--col);margin:0 auto}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.top .in{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px}
.mark{font:400 26px/1 var(--display);letter-spacing:-.01em;margin:0}
.mark span{color:var(--ink-2);font-size:.62em;margin-inline-start:6px;letter-spacing:0}
.pagetitle{font:600 22px/1 var(--body);margin:0}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;transition:transform .15s,background .2s}
.iconbtn:hover{background:var(--surface)}
.iconbtn:active{transform:scale(.88)}

/* stories tray */
#v-home{padding-top:env(safe-area-inset-top,0px)}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;transition:height .3s cubic-bezier(.2,.8,.2,1)}
.ptr .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--ink);transform:rotate(var(--turn,0deg));opacity:.5;transition:opacity .2s}
.ptr.armed .spin{opacity:1}
.ptr.busy .spin{opacity:1;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tray{display:flex;gap:14px;overflow-x:auto;padding:14px 16px 14px;scrollbar-width:none;overscroll-behavior-x:contain}
.tray::-webkit-scrollbar{display:none}
.story{flex:none;width:72px;display:grid;justify-items:center;gap:5px;font-size:12px;color:var(--ink)}
.ring{width:70px;height:70px;border-radius:50%;padding:2.5px;background:var(--ring);transition:transform .18s}
.story.seen .ring{background:var(--surface-2)}
.story:active .ring{transform:scale(.92)}
.bubble{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:var(--sbg,var(--surface));display:grid;place-items:center;font-size:30px;line-height:1}
.story .lbl{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* posts */
.feed{display:grid;gap:8px;padding-bottom:12px}
.post{min-width:0}
.phead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:600 15px var(--body);text-transform:uppercase;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.au-d .av,.au-d.av{color:#121519}
.au-s{--c:var(--s)} .au-a{--c:var(--a)} .au-d{--c:var(--d)}
.who{font-weight:600;font-size:14px}
.when{color:var(--ink-2);font-size:14px}
.phead .sp{flex:1}
.linkish{font-weight:600}
.linkish:hover{text-decoration:underline}

.art{position:relative;aspect-ratio:4/5;container-type:inline-size;overflow:hidden;background:var(--g);color:var(--fg);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.art .pat{position:absolute;inset:-10%;background-image:var(--pat);background-size:var(--patsz,34%);opacity:.9;transform:rotate(-8deg)}
.art .txt{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:4cqw;padding:10cqw 9cqw;text-align:center}
.pun{margin:0;font:800 var(--fs,10cqw)/1.08 var(--body);letter-spacing:-.01em;overflow-wrap:anywhere;text-wrap:balance}
.ex{white-space:pre-line;margin:0;font:500 var(--es,4.6cqw)/1.3 var(--body);opacity:.92;overflow-wrap:anywhere;text-wrap:balance;max-width:92%}
.burst{position:absolute;left:50%;top:50%;width:26cqw;height:26cqw;margin:-13cqw 0 0 -13cqw;fill:#fff;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 10px rgba(0,0,0,.25))}
.burst.go{animation:burst .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes burst{0%{opacity:0;transform:scale(.2)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.95)}45%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1) translateY(-8cqw)}}

.acts{display:flex;align-items:center;gap:4px;padding:6px 8px 0}
.act{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;transition:transform .15s}
.act:active{transform:scale(.85)}
.act .ico{width:26px;height:26px}
.like[aria-pressed="true"]{color:var(--like)}
.like[aria-pressed="true"] .ico{fill:var(--like);stroke:var(--like)}
.like.pop .ico{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.pbody{padding:2px 14px 6px;display:grid;gap:4px}
.likes{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.likes.zero{font-weight:400;color:var(--ink-2)}
.cap{font-size:14px}
.tag{color:var(--link)}
.date{font-size:12px;color:var(--ink-2)}
.more{height:1px}
.end{padding:28px 16px;text-align:center;color:var(--ink-2)}
.end button{color:var(--link);font-weight:600}

/* archive: one sticky row (search · filters · view), active-filter chips only when something is on */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tools.tuck{transform:translateY(-100%)}
.sbar{display:flex;gap:8px;align-items:center;min-width:0}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:var(--surface);padding:0 12px;color:var(--ink-2)}
.search .ico{width:20px;height:20px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:16px}
.search input::placeholder{color:var(--ink-2)}
.tbtn{position:relative;flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--ink);transition:transform .15s,background .2s}
.tbtn:active{transform:scale(.9)}
.tbtn .ico{width:22px;height:22px}
.tbtn.on{background:var(--ink);color:var(--bg)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--like);color:#fff;font:600 11px/18px var(--body);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.active{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.active::-webkit-scrollbar{display:none}
.achip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 10px;border-radius:15px;background:var(--surface);font-size:13px;font-weight:500}
.achip .av{width:20px;height:20px;margin-inline-start:-4px}
.achip .ico{width:14px;height:14px;color:var(--ink-2)}
.active .clear{flex:none;height:30px;padding:0 6px;font-size:13px;font-weight:600;color:var(--link)}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* filter sheet */
.fs-bg{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;align-items:end;justify-items:center;animation:fade .2s}
.fs-bg.out{opacity:0;transition:opacity .2s}
.fsheet{width:min(520px,100%);max-height:88dvh;display:flex;flex-direction:column;background:var(--elev);border-radius:20px 20px 0 0;padding:8px 0 calc(14px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.fsheet .grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--surface-2);margin-bottom:4px}
.fs-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:0 10px 6px;touch-action:none}
.fs-head h2{margin:0;text-align:center;font:600 17px var(--body)}
.fs-reset{font-weight:600;font-size:15px;color:var(--link);padding:0 8px;height:40px}
.fs-reset[disabled]{color:var(--ink-2);opacity:.5;cursor:default}
.fs-body{overflow-y:auto;padding:4px 16px 12px;display:grid;gap:20px;overscroll-behavior:contain}
.fs-sec h3{margin:0 0 10px;font:600 15px var(--body)}
.fs-people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.person{display:grid;justify-items:center;gap:6px;padding:10px 0;border-radius:14px;font-size:14px;font-weight:500;transition:background .2s}
.person .av{width:60px;height:60px;box-shadow:0 0 0 2px var(--elev),0 0 0 4px transparent;transition:box-shadow .2s,transform .2s}
.person[aria-pressed="true"]{background:var(--surface)}
.person[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--elev),0 0 0 4px var(--ink);transform:scale(1.04)}
.fs-wrap{display:flex;flex-wrap:wrap;gap:8px}
.fs-go{margin:8px 16px 0;height:50px;border-radius:14px;background:var(--link);color:#fff;font:600 16px var(--body);transition:transform .15s,opacity .2s}
.fs-go:active{transform:scale(.98)}
.fs-go[disabled]{opacity:.45;cursor:default}
@keyframes up{from{transform:translateY(100%)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid .art{cursor:pointer}
.grid .ex{display:none}
.list{display:grid}
.li{display:flex;gap:14px;padding:14px 16px;align-items:center;text-align:start;width:100%;border-radius:0}
.li:hover{background:var(--surface)}
.li .b{min-width:0;flex:1;display:grid;gap:4px}
.li .t{font:800 21px/1.2 var(--body);letter-spacing:-.01em;overflow-wrap:anywhere}
.li .e{color:var(--ink-2);font-size:14px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-line}
.li .m{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin-top:2px}
.li .m .av{width:20px;height:20px;font-size:10px}
.li .emo{flex:none;width:52px;height:52px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:30px;line-height:1}
.li:hover .emo{background:var(--surface-2)}
.empty{padding:56px 24px;text-align:center;color:var(--ink-2);display:grid;gap:10px;justify-items:center}
.empty .big{width:72px;height:72px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;color:var(--ink)}
.empty .big .ico{width:36px;height:36px}
.empty h2{margin:0;font:600 22px var(--body);color:var(--ink)}
.empty p{margin:0;max-width:30ch}

/* floating nav: frosted capsule with a sliding highlight, after Instagram's current tab bar */
.nav{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;
  width:min(380px,calc(100% - 32px));height:64px;border-radius:32px;padding:6px;
  background:color-mix(in srgb,var(--elev) 70%,transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  box-shadow:0 10px 30px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px color-mix(in srgb,var(--ink) 9%,transparent);
  display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;
  transform-origin:50% 100%;transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.nav.press{transform:scale(1.045)}
.nav.compact{transform:scale(.84) translateY(6px)}
.nav .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 3);border-radius:26px;
  background:color-mix(in srgb,var(--ink) 11%,transparent);transition:transform .5s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.nav.press .pill{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.tab{position:relative;display:grid;place-items:center;border-radius:26px;color:var(--ink);transition:transform .2s}
.tab:active{transform:scale(.9)}
.tab .ico{width:27px;height:27px}
.tab .on{display:none}
.tab[aria-selected="true"] .off{display:none}
.tab[aria-selected="true"] .on{display:block}
.tab .on{fill:currentColor}
.tab .on.stroke{fill:none;stroke-width:2.8}

/* overlays */
@keyframes fade{from{opacity:0}}

.single{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;animation:slidein .25s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}

/* story viewer */
.sv{position:fixed;inset:0;z-index:70;background:#000;display:grid;place-items:center;animation:fade .2s}
.sv .frame{position:relative;width:min(100vw,calc(100dvh * 9 / 16));height:100dvh;max-height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
@media (min-width:600px){.sv .frame{height:min(92dvh,860px);width:calc(min(92dvh,860px) * 9 / 16);border-radius:12px}}
.sv .art{position:absolute;inset:0;aspect-ratio:auto}
.sv .art .txt{padding:22cqw 10cqw 26cqw}
.sv .bars{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;gap:3px;z-index:3}
.sv .bars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.4);overflow:hidden}
.sv .bars i b{display:block;height:100%;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.sv .bars i.done b{transform:scaleX(1)}
.sv .hd{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:12px;right:6px;z-index:3;display:flex;align-items:center;gap:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.sv .hd .bubble{width:34px;height:34px;border:0;font-size:18px;background:rgba(255,255,255,.22)}
.sv .hd .n{font-weight:600;font-size:14px}
.sv .hd .w{opacity:.85;font-size:14px}
.sv .hd .sp{flex:1}
.sv .hd button{width:40px;height:40px;display:grid;place-items:center;color:#fff}
.sv .ft{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;justify-content:flex-end;gap:6px;padding:0 12px;color:#fff}
.sv .ft .act{background:rgba(0,0,0,.18)}
.sv .ft .like[aria-pressed="true"]{color:var(--like)}
.sv .ft .n{align-self:center;font-weight:600;font-size:14px;margin-inline-end:auto;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.sv .hint{position:absolute;inset:auto 0 calc(70px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:13px;opacity:.8;z-index:3;pointer-events:none}
.sv .paused .bars{opacity:.4}
.sv .slide{animation:storyin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes storyin{from{transform:scale(.96);opacity:.4}}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 48px);animation:up2 .25s}
@keyframes up2{from{opacity:0;transform:translate(-50%,10px)}}

.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

@media (min-width:500px){
  .feed{gap:20px}
  .post .art{border-radius:6px}
  .phead{padding-inline:4px}.acts{padding-inline:0}.pbody{padding-inline:4px}
  .feed,.tray-wrap{padding-inline:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<header class="top"><div class="col in" id="topbar"></div></header>
<main class="col">
  <section id="v-home" aria-label="Home"></section>
  <section id="v-archive" aria-label="Archive" hidden></section>
  <section id="v-liked" aria-label="Liked" hidden></section>
</main>
<nav class="nav" aria-label="Main" role="tablist" id="nav"></nav>
