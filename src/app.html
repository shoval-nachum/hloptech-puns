const FIREBASE = (() => { try { return JSON.parse(document.getElementById('firebase-config').textContent); } catch { return {}; } })();
async function claudeBackend(){
  if (!window.claude || !window.claude.use) return null;
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db || !user) return null;
  const uid = await user.id();
  if (!uid) return null;
  let wr = null; try { wr = user.can ? await user.can('data.write') : null; } catch {}
  return {uid, can:wr !== false,
    save:body => db.doc('reactions/' + uid).set(body),
    watch:fn => db.collection('reactions').onSnapshot(snap => fn(snap.docs.map(d => ({id:d.id, data:d.data() || {}, pending:d.metadata.hasPendingWrites}))), () => {})};
}
async function firebaseBackend(){
  if (!FIREBASE.apiKey) return null;
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, {getAuth, signInAnonymously}, fs] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(FIREBASE);
  const cred = await signInAnonymously(getAuth(app));   // a silent per-device id, no account needed
  const uid = cred.user.uid, db = fs.getFirestore(app);
  return {uid, can:true,
    save:body => fs.setDoc(fs.doc(db, 'reactions', uid), body),
    watch:fn => fs.onSnapshot(fs.collection(db, 'reactions'),
      snap => fn(snap.docs.map(d => ({id:d.id, data:d.data() || {}, pending:d.metadata.hasPendingWrites}))), () => {})};
}
(async () => {
  try {
    const be = (await claudeBackend().catch(() => null)) || (await firebaseBackend().catch(() => null));
    if (!be) return;
    R.db = {doc:() => ({set:be.save})}; R.uid = be.uid; R.can = be.can; R.ready = true;
    be.watch(docs => {
      const totals = {};
      docs.forEach(doc => {
        const r = doc.data.r || {};
        for (const k in r) totals[k] = (totals[k] || 0) + 1;

const NAV = { pill:null, drag:null };
function placePill(i, live){
  NAV.pill.style.transition = live ? 'none' : '';

}
function buildNav(){
  const nav = $('#nav');
  NAV.pill = el('span', 'pill'); NAV.pill.setAttribute('aria-hidden', 'true'); nav.append(NAV.pill);
  TABS.forEach(t => {
    const b = el('button', 'tab'); b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.tab = t.id;
    b.setAttribute('aria-label', t.label); b.title = t.label;
    b.innerHTML = t.off + t.on;
    b.addEventListener('click', e => {
      if (NAV.dragged) { NAV.dragged = false; return; }
      if (S.tab !== t.id) go(t.id);
      else if (window.scrollY > 4) window.scrollTo({top:0, behavior:'smooth'});
      else if (t.id === 'home') refreshHome();
    });
    nav.append(b);
  });
  const slot = x => { const r = nav.getBoundingClientRect(); return Math.max(0, Math.min(TABS.length - 1, (x - r.left - 6) / ((r.width - 12) / TABS.length))); };
  nav.addEventListener('pointerdown', e => {
    nav.classList.add('press'); nav.classList.remove('compact');
    NAV.drag = {x0:e.clientX, moved:false};
  });
  nav.addEventListener('pointermove', e => {
    if (!NAV.drag) return;
    if (!NAV.drag.moved && Math.abs(e.clientX - NAV.drag.x0) < 12) return;
    if (!NAV.drag.moved) { NAV.drag.moved = true; try { nav.setPointerCapture(e.pointerId); } catch {} }
    placePill(slot(e.clientX) - .5 < 0 ? 0 : Math.min(TABS.length - 1, slot(e.clientX) - .5), true);
  });
  const end = e => {
    nav.classList.remove('press');
    if (!NAV.drag) return;
    const moved = NAV.drag.moved; NAV.drag = null;
    if (!moved) return;
    NAV.dragged = true; setTimeout(() => { NAV.dragged = false; }, 50);
    const i = Math.floor(slot(e.clientX));
    placePill(i);
    if (TABS[i].id !== S.tab) go(TABS[i].id); else placePill(i);
  };
  nav.addEventListener('pointerup', end);
  nav.addEventListener('pointercancel', e => { nav.classList.remove('press'); NAV.drag = null; placePill(TABS.findIndex(t => t.id === S.tab)); });

    const y = window.scrollY, dy = y - lastY; lastY = y;
