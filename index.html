  return out;
}

/* ---------- emoji pattern tiles (shared by DOM and canvas) ---------- */
const tiles = {};
function tileFor(e){
  const key = e.join('');
  if (tiles[key]) return tiles[key];
  const c = document.createElement('canvas'), n = 240;
  c.width = c.height = n;
  const x = c.getContext('2d');
  x.globalAlpha = .22; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '64px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  x.fillText(e[0], n * .25, n * .27);
  x.fillText(e[1], n * .75, n * .77);
  const url = c.toDataURL('image/png');
  return (tiles[key] = {canvas:c, url});
}

/* ---------- joke art ---------- */
function sizes(j){
  const L = [...j.big].length;
  const longest = Math.max(...j.big.split(/\s+/).map(s => [...s].length));
  const fs = Math.min(L <= 7 ? 17 : L <= 12 ? 13.5 : L <= 18 ? 11.2 : L <= 26 ? 9.4 : L <= 38 ? 8 : L <= 56 ? 6.8 : 5.6, 80 / (0.62 * longest));
  const E = [...j.small].length;
  const es = E <= 40 ? 4.8 : E <= 80 ? 4.2 : 3.6;
  return {fs, es};
}
function art(j, opts = {}){
  const a = el('div', 'art');
  const [g1, g2, fg] = opts.pal || j.pal;
  a.style.setProperty('--g', `linear-gradient(150deg, ${g1}, ${g2})`);
  a.style.setProperty('--fg', fg);
  const pat = el('div', 'pat'); pat.setAttribute('aria-hidden', 'true');
  pat.style.setProperty('--pat', `url(${tileFor(j.emo).url})`);
  a.append(pat);
  const {fs, es} = sizes(j);
  const box = el('div', 'txt');
  const p = el('p', 'pun', j.big); p.dir = 'auto'; p.style.setProperty('--fs', (opts.story ? fs * 1.08 : fs) + 'cqw'); box.append(p);
  if (j.small) { const e = el('p', 'ex', j.small.replace(/\s*\|\|\s*/g, '\n')); e.dir = 'auto'; e.style.setProperty('--es', (opts.story ? es * 1.15 : es) + 'cqw'); box.append(e); }
  a.append(box);
  a.setAttribute('role', 'img');
  a.setAttribute('aria-label', j.big + (j.small ? ' — ' + j.small : ''));
  return a;
}

}
const shareText = j => j.t + (j.e ? '\n' + j.e : '') + '\n— ' + AUTH[j.a].name;
/* Share = copy the post as an image to the clipboard; fall back to saving it, then to copying the text */
async function openShare(j, onDone){
  const png = renderPng(j);

    if (!window.ClipboardItem || !navigator.clipboard || !navigator.clipboard.write) throw new Error('no clipboard');

  } catch {
    try {

    } catch (e) {
